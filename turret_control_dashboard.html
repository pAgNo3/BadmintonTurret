<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turret Control Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Base Horizontal Slider Styling */
        input[type=range].turret-slider {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
            margin: 10px 0;
        }
        input[type=range].turret-slider:focus {
            outline: none;
        }
        input[type=range].turret-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #334155;
            border-radius: 4px;
            border: 1px solid #1e293b;
        }
        input[type=range].turret-slider::-webkit-slider-thumb {
            border: 2px solid #06b6d4; /* Cyan 500 */
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: #0f172a;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -11px;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
            transition: transform 0.1s ease, background-color 0.1s ease;
        }
        input[type=range].turret-slider::-webkit-slider-thumb:hover,
        input[type=range].turret-slider::-webkit-slider-thumb:active {
            background: #06b6d4;
            transform: scale(1.15);
        }

        /* Vertical Slider Wrapper for Pitch */
        .slider-vertical-wrapper {
            position: relative;
            width: 60px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
        }
        .slider-vertical-wrapper input[type=range] {
            width: 200px; /* Transformed to vertical height */
            transform: rotate(-90deg);
        }

        /* Hide Number Input Arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Custom Scrollbar for Terminal Console */
        .console-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .console-scroll::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .console-scroll::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        
        .active-press {
            transform: scale(0.96);
            background-color: #b91c1c !important; /* Darker Red */
            box-shadow: 0 0 35px rgba(220, 38, 38, 0.9) !important;
        }
    </style>
</head>
<body class="p-4 md:p-6 gap-4">

    <!-- Header Section -->
    <header class="border-b border-slate-700 pb-3 flex flex-col md:flex-row justify-between items-start md:items-end shrink-0 gap-3">
        <div>
            <h1 class="text-3xl font-bold tracking-wider text-cyan-400">Badminton<span class="text-white"> Turret</span></h1>
            <p class="text-slate-400 text-sm tracking-widest mt-1">Control GUI</p>
        </div>
        
        <!-- Serial Connection Bar -->
        <div class="flex flex-wrap items-center gap-3">
            <button id="connectBtn" onclick="connectSerial()" class="px-4 py-2 text-sm font-bold font-mono rounded bg-cyan-600 hover:bg-cyan-500 text-white border border-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.4)] cursor-pointer transition">
                CONNECT SERIAL
            </button>
            <div id="statusBadge" class="flex items-center gap-2 text-red-400 text-sm font-mono bg-red-950/40 px-4 py-2 rounded border border-red-800 shadow-[0_0_10px_rgba(239,68,68,0.1)]">
                <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                <span id="statusText">DISCONNECTED</span>
            </div>
        </div>
    </header>

    <main class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-6 overflow-y-auto pb-4">
        
        <!-- LEFT PANEL: Aiming Matrix (Pitch & Yaw) -->
        <div class="lg:col-span-7 bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg flex flex-col">
            <h2 class="text-lg text-slate-300 font-bold tracking-wider mb-4 border-b border-slate-700 pb-2">AIMING MATRIX</h2>
            
            <div class="flex-1 flex flex-col md:flex-row gap-6 items-center justify-center">
                
                <!-- PITCH (Vertical Control) -->
                <div class="flex flex-col items-center gap-2 bg-slate-900/80 p-4 rounded-xl border border-slate-700 h-full justify-between w-full md:w-1/3">
                    <div class="text-center w-full">
                        <h3 class="text-cyan-400 font-bold tracking-widest text-sm">PITCH (p)</h3>
                        <span class="text-xs text-slate-500 font-mono">70° - 130°</span>
                    </div>
                    
                    <div class="slider-vertical-wrapper">
                        <input type="range" id="pitchSlider" class="turret-slider" min="70" max="130" value="100">
                    </div>
                    
                    <div class="flex items-center gap-1 bg-slate-800 rounded p-2 border border-slate-600 mt-2">
                        <input type="number" id="pitchInput" class="w-16 bg-transparent text-center text-white font-mono font-bold text-xl focus:outline-none focus:bg-slate-700 rounded" value="100" min="70" max="130">
                        <span class="text-slate-500 text-xs pr-1 font-mono">DEG</span>
                    </div>
                </div>

                <!-- YAW (Horizontal Control) -->
                <div class="flex flex-col items-center gap-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700 h-full justify-center w-full md:w-2/3">
                    <div class="text-center w-full">
                        <h3 class="text-cyan-400 font-bold tracking-widest text-sm">YAW (y)</h3>
                        <span class="text-xs text-slate-500 font-mono">0° - 180°</span>
                    </div>
                    
                    <div class="w-full px-4 py-6">
                        <input type="range" id="yawSlider" class="turret-slider" min="0" max="180" value="90">
                    </div>
                    
                    <div class="flex items-center gap-1 bg-slate-800 rounded p-2 border border-slate-600">
                        <input type="number" id="yawInput" class="w-16 bg-transparent text-center text-white font-mono font-bold text-xl focus:outline-none focus:bg-slate-700 rounded" value="90" min="0" max="180">
                        <span class="text-slate-500 text-xs pr-1 font-mono">DEG</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- RIGHT PANEL: Speed, Feeder & Trigger Controls -->
        <div class="lg:col-span-5 flex flex-col gap-4">
            
            <!-- SPEED Control -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <h3 class="text-cyan-400 font-bold tracking-wider text-sm">SPEED (s)</h3>
                        <span class="text-xs text-slate-500 font-mono">0 - 50</span>
                    </div>
                    <div class="flex items-center gap-1 bg-slate-900 rounded p-2 border border-slate-600">
                        <input type="number" id="speedInput" class="w-16 bg-transparent text-center text-white font-mono font-bold text-xl focus:outline-none focus:bg-slate-700 rounded" value="0" min="0" max="50">
                        <span class="text-slate-500 text-xs pr-1 font-mono">PCT</span>
                    </div>
                </div>
                <input type="range" id="speedSlider" class="turret-slider mt-4" min="0" max="50" value="0">
            </div>

            <!-- FEEDER Control -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <h3 class="text-cyan-400 font-bold tracking-wider text-sm">FEEDER (f)</h3>
                        <span class="text-xs text-slate-500 font-mono">0° - 180°</span>
                    </div>
                    <div class="flex items-center gap-1 bg-slate-900 rounded p-2 border border-slate-600">
                        <input type="number" id="feedInput" class="w-16 bg-transparent text-center text-white font-mono font-bold text-xl focus:outline-none focus:bg-slate-700 rounded" value="77" min="0" max="180">
                        <span class="text-slate-500 text-xs pr-1 font-mono">DEG</span>
                    </div>
                </div>
                <input type="range" id="feedSlider" class="turret-slider mt-4" min="0" max="180" value="77">
            </div>

            <!-- SHOOT BUTTON -->
            <button id="shootBtn" class="flex-1 min-h-[100px] bg-red-600 hover:bg-red-500 text-white font-bold text-3xl rounded-xl shadow-[0_0_20px_rgba(220,38,38,0.5)] border-2 border-red-400 transition-all flex items-center justify-center gap-4 select-none cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21v-4"/><path d="M11 13V9"/><path d="M11 5V1"/><path d="M18 11h4"/><path d="M10 11h4"/><path d="M2 11h4"/><circle cx="11" cy="11" r="8"/></svg>
                SHOOT (sh)
            </button>

        </div>
    </main>

    <!-- BOTTOM: TX Console Monitor -->
    <footer class="bg-black rounded-xl border border-slate-700 overflow-hidden h-40 flex flex-col shadow-inner shrink-0 mb-2">
        <div class="bg-slate-800 text-xs text-slate-400 px-4 py-2 border-b border-slate-700 flex justify-between font-mono">
            <span>TX SERIAL MONITOR LOG</span>
            <span>10Hz (100ms) | Compact Protocol</span>
        </div>
        <div id="serialConsole" class="p-3 font-mono text-xs text-green-400 flex-1 overflow-y-auto console-scroll leading-relaxed whitespace-pre-wrap">
            <!-- Serial packet logs stream here -->
        </div>
    </footer>

    <script>
        // Global System State
        let state = {
            pitch: 100,
            yaw: 90,
            speed: 0,
            feed: 77,
            shoot: 0
        };

        // Web Serial API Handles
        let port;
        let writer;

        // DOM Cache
        const els = {
            pitch: { slider: document.getElementById('pitchSlider'), input: document.getElementById('pitchInput') },
            yaw:   { slider: document.getElementById('yawSlider'), input: document.getElementById('yawInput') },
            speed: { slider: document.getElementById('speedSlider'), input: document.getElementById('speedInput') },
            feed:  { slider: document.getElementById('feedSlider'), input: document.getElementById('feedInput') },
            shootBtn: document.getElementById('shootBtn'),
            connectBtn: document.getElementById('connectBtn'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            statusBadge: document.getElementById('statusBadge'),
            console: document.getElementById('serialConsole')
        };

        function clamp(value, min, max) {
            let val = parseInt(value);
            if (isNaN(val)) return min;
            if (val < min) return min;
            if (val > max) return max;
            return val;
        }

        // Bidirectional Input Binding
        function bindControl(key, min, max) {
            els[key].slider.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                els[key].input.value = val;
                state[key] = val;
            });

            els[key].input.addEventListener('change', (e) => {
                let val = clamp(e.target.value, min, max);
                e.target.value = val;
                els[key].slider.value = val;
                state[key] = val;
            });
            
            els[key].input.addEventListener('keyup', (e) => {
                let val = parseInt(e.target.value);
                if (!isNaN(val) && val >= min && val <= max) {
                    els[key].slider.value = val;
                    state[key] = val;
                }
            });
        }

        bindControl('pitch', 70, 130);
        bindControl('yaw', 0, 180);
        bindControl('speed', 0, 50);
        bindControl('feed', 0, 180);

        async function connectSerial() {
            if (!('serial' in navigator)) {
                alert("Web Serial API is not supported in this browser. Please use Google Chrome or Chromium.");
                logConsole("ERROR: Web Serial API not supported in current browser.", true);
                return;
            }

            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });

                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();

                document.getElementById('statusText').innerText = "CONNECTED (/dev/rfcomm0)";
                document.getElementById('statusDot').classList.replace('bg-red-500', 'bg-green-500');
                els.statusBadge.classList.replace('border-red-800', 'border-emerald-700');
                els.statusBadge.classList.replace('text-red-400', 'text-emerald-400');
                els.statusBadge.classList.replace('bg-red-950/40', 'bg-emerald-950/40');

                logConsole("--- SERIAL LINK OPENED AT 9600 BAUD ---", false);
            } catch (err) {
                console.error("Serial Connection Failed:", err);
                if (err.name !== 'NotFoundError') {
                    alert("Failed to connect: " + err.message);
                    logConsole(`CONNECTION ERROR: ${err.message}`, true);
                }
            }
        }

        async function sendSerialPacket(jsonString) {
            if (writer) {
                try {
                    await writer.write(jsonString + "\n");
                } catch (err) {
                    console.error("TX Error:", err);
                    logConsole(`TX ERROR: ${err.message}`, true);
                }
            }
        }

        const MAX_LOG_LINES = 15;

        async function transmit() {
            // Minify payload key names to keep buffer tiny
            const compactPayload = {
                p:  state.pitch,
                y:  state.yaw,
                s:  state.speed,
                f:  state.feed,
                sh: state.shoot
            };

            const payloadString = JSON.stringify(compactPayload);
            
            // 1. Send via Web Serial
            await sendSerialPacket(payloadString);

            // 2. Append to terminal log
            const now = new Date();
            const ms = now.getMilliseconds().toString().padStart(3, '0');
            const timestamp = `${now.toLocaleTimeString('en-US', { hour12: false })}.${ms}`;
            
            const logLine = document.createElement('div');
            if (state.shoot === 1) {
                logLine.className = 'text-red-400 font-bold bg-red-900/40 px-2 rounded py-0.5 my-0.5 border border-red-700/60';
            } else {
                logLine.className = 'hover:bg-slate-800/50 px-2 py-0.5 rounded';
            }
            
            const channelTag = writer ? 'TX [LIVE]' : 'TX [SIM]';
            logLine.textContent = `[${timestamp}] ${channelTag}: ${payloadString}`;
            els.console.appendChild(logLine);

            while (els.console.childNodes.length > MAX_LOG_LINES) {
                els.console.removeChild(els.console.firstChild);
            }
            
            els.console.scrollTop = els.console.scrollHeight;
        }

        function logConsole(msg, isError) {
            const logLine = document.createElement('div');
            logLine.className = isError ? 'text-red-400 font-bold py-0.5' : 'text-cyan-400 font-bold py-0.5';
            logLine.textContent = msg;
            els.console.appendChild(logLine);
            els.console.scrollTop = els.console.scrollHeight;
        }

        // 10Hz (100ms) interval to fit comfortably within 9600 baud limits
        setInterval(transmit, 100);

        function engageShoot(e) {
            if (e) e.preventDefault();
            if (state.shoot === 1) return;
            
            state.shoot = 1;
            els.shootBtn.classList.add('active-press');
            
            // Immediate transmission on click
            transmit();
        }

        function releaseShoot(e) {
            if (e) e.preventDefault();
            state.shoot = 0;
            els.shootBtn.classList.remove('active-press');
        }

        // Mouse/Touch bindings for Shoot button
        els.shootBtn.addEventListener('mousedown', engageShoot);
        els.shootBtn.addEventListener('touchstart', engageShoot, { passive: false });
        els.shootBtn.addEventListener('mouseup', releaseShoot);
        els.shootBtn.addEventListener('mouseleave', releaseShoot);
        els.shootBtn.addEventListener('touchend', releaseShoot);
        els.shootBtn.addEventListener('touchcancel', releaseShoot);

    </script>
</body>
</html>
